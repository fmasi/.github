name: Reusable / Claude mention

# `@claude` on issues and PRs, author-gated. Called from each repo's thin
# .github/workflows/claude.yml (template in this repo's README, "CI standard"),
# which listens on:
#   issue_comment: [created], pull_request_review_comment: [created],
#   pull_request_review: [submitted], issues: [opened]
#
# Gate: the text must mention `@claude` AND its author must be the OWNER, a
# MEMBER or a COLLABORATOR. claude-code-action has its own write-access check,
# but it has had bugs (action issues #351/#387), so this is defence in depth
# against anyone dropping "@claude" into a public issue to spend the token and
# minutes. Every other comment starts a run whose job is skipped, which is free.
#
# `@claude review` on a PR re-runs a review after fixes (see claude-review.yml).
#
# Check name in callers: `<caller-job-id> / claude` (standard caller: `claude / claude`).
#
# The CALLER must grant these on the calling job (a called workflow can only
# narrow the GITHUB_TOKEN, never widen it):
#   permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
# and pass the secret explicitly:
#   secrets: { CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} }

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 30
      claude-args:
        description: Extra Claude CLI args (e.g. `--max-turns 30` or `--allowedTools "Bash(just:*)"`).
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >
          Claude Code OAuth token (from `/install-github-app` in Claude Code).
          Optional so repos without it stay green: the job then posts a notice
          and skips the Claude call. (A caller job with `uses:` cannot read
          `secrets` in its own `if:`, so the skip has to live here.)
        required: false

jobs:
  claude:
    # Verbatim from fmasi/mailrag .github/workflows/claude.yml.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Check for Claude token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set in this repo; skipping the @claude run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1 (2026-09-26)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: ${{ inputs.claude-args }}
